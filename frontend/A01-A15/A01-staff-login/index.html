<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập quản trị</title><link rel="stylesheet" href="../../components/admin-shell.css"><style>.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(440px,100%);background:var(--panel);padding:28px;border:1px solid var(--line);border-top:3px solid var(--red);border-radius:8px}label{display:block;font-size:12px;margin:14px 0 6px}input{width:100%;padding:12px;background:#0e1013;color:white;border:1px solid var(--line);border-radius:5px}</style></head><body><div class="login-wrap"><section class="login"><div class="logo">PCBUILDER<span>STORE</span></div><div class="eyebrow">Khu v&#7921;c qu&#7843;n tr&#7883;</div><h1 style="font-size:24px;margin-top:20px">Đăng nhập quản trị</h1><p>Đăng nhập bằng tài khoản nhân viên đã được cấp.</p><form onsubmit="event.preventDefault();document.getElementById('msg').hidden=false"><label>Email nhân viên</label><input type="email" required autocomplete="username" placeholder="name@company.vn"><label>Mật khẩu</label><input type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu"><div class="toolbar"><button class="primary" type="submit">Đăng nhập</button></div><div id="msg" class="note danger" hidden>Chức năng đăng nhập chưa được kết nối với hệ thống.</div></form></section></div></body></html>
