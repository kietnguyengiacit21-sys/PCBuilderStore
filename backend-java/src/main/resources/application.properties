spring.application.name=pc-builder-store-api
server.port=${PORT:8081}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never
catalog.import.default-stock=${CATALOG_IMPORT_DEFAULT_STOCK:5}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=PCBS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
product.media.directory=${PRODUCT_MEDIA_DIRECTORY:${user.home}/.pc-builder-store/product-media}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
