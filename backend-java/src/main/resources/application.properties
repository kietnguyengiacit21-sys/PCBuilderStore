spring.application.name=pc-builder-store-api
server.port=${PORT:8081}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never
catalog.import.default-stock=${CATALOG_IMPORT_DEFAULT_STOCK:5}
# ALL_STORED shows every stored specification value, verified or not (owner decision 2026-11-21).
# Set ALLOWLIST to show only values the internal ledger marks PUBLIC_ALLOWLIST.
catalog.specifications.visibility=${CATALOG_SPECIFICATION_VISIBILITY:ALL_STORED}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=PCBS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
product.media.directory=${PRODUCT_MEDIA_DIRECTORY:${user.home}/.pc-builder-store/product-media}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Password reset emails link to the storefront at this address.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@pcbuilderstore.local}
# SMTP for password reset emails. Leave spring.mail.host unset locally: the reset link is then
# written to the server log instead. In production set SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD and SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true.

# Payment methods. Cash on delivery is always offered.
# Bank transfer (VietQR) appears at checkout once these are set; staff then confirm each transfer in
# admin > Đơn hàng. APP_PAYMENT_BANK_BIN is the 6-digit NAPAS bank code (e.g. 970436 Vietcombank,
# 970415 VietinBank, 970418 BIDV, 970422 MB, 970407 Techcombank, 970416 ACB).
app.payment.bank.bin=${APP_PAYMENT_BANK_BIN:}
app.payment.bank.name=${APP_PAYMENT_BANK_NAME:}
app.payment.bank.account-number=${APP_PAYMENT_BANK_ACCOUNT_NUMBER:}
app.payment.bank.account-name=${APP_PAYMENT_BANK_ACCOUNT_NAME:}
# The simulated online gateway marks orders PAID without any money moving: demo/testing only.
orders.simulated-payment.enabled=${ORDERS_SIMULATED_PAYMENT_ENABLED:false}
